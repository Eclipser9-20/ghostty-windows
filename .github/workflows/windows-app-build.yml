on:
  push:
    branches:
      - "windows-gtk-app"
  workflow_dispatch: {}

name: Windows App Build (experimental)

jobs:
  build-windows-gtk:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2 with GTK4/libadwaita
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-blueprint-compiler
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-libthai
            mingw-w64-x86_64-libdatrie
            mingw-w64-x86_64-appstream

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Diagnostic - list relevant MinGW lib files before aliasing
        run: |
          ls -la /mingw64/lib/ | grep -Ei 'glib-2\.0|ffi|pcre2|iconv|fribidi|thai|appstream' || true

      - name: Alias MinGW .dll.a import libs to .a (Zig doesn't recognize .dll.a)
        run: |
          for f in /mingw64/lib/*.dll.a; do
            cp -n "$f" "${f%.dll.a}.a"
          done

      - name: Wrap blueprint-compiler in a .cmd shim (Windows can't exec a bare shebang script)
        run: |
          cat > /mingw64/bin/blueprint-compiler.cmd <<'EOF'
          @echo off
          python3 "%~dp0blueprint-compiler" %*
          EOF
          cmd //c blueprint-compiler.cmd --version

      - name: Attempt GTK app-runtime build
        env:
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: "1"
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          pkg-config --libs gtk4
          # -Dsimd=false: Zig 0.16's bundled libc++ appears structurally
          # broken for the x86_64-windows-gnu target when compiling the
          # vendored SIMD .cpp files (highway/simdutf) — a libc++
          # self-check ("tried including <string.h> but didn't find
          # libc++'s own") fails regardless of link_libcpp settings. This
          # skips that C++ compilation entirely in favor of portable Zig
          # fallbacks, to get a working baseline build; SIMD accel on
          # Windows can be revisited once the toolchain issue is understood.
          zig build -Dapp-runtime=gtk -Dtarget=x86_64-windows-gnu -Dsimd=false
